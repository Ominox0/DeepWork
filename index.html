<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepWork - Minimal Focus Timer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <!-- Monetization: Top Banner (Affiliate Placeholder) -->
        <div class="ad-banner" id="affiliate-banner">
            <a href="https://brain.fm?afid=your_id" target="_blank">
                🚀 Need better focus? Try <span>Brain.fm</span> (Scientific Music)
            </a>
        </div>

        <header>
            <h1>DeepWork</h1>
            <p>Silence the noise. Get things done.</p>
        </header>

        <main>
            <div class="timer-section">
                <div class="timer-display" id="timer">25:00</div>
                <div class="controls">
                    <button id="start-btn" class="primary-btn">Start Session</button>
                    <button id="reset-btn" class="secondary-btn">Reset</button>
                </div>
                <div class="mode-selectors">
                    <button class="mode-btn active" data-time="1500">Pomodoro</button>
                    <button class="mode-btn" data-time="300">Short Break</button>
                    <button class="mode-btn" data-time="900">Long Break</button>
                </div>
            </div>

            <div class="tasks-section">
                <h3>Today's Deep Work Tasks</h3>
                <div class="input-group">
                    <input type="text" id="task-input" placeholder="What are you focusing on?">
                    <button id="add-task-btn">+</button>
                </div>
                <ul id="task-list"></ul>
            </div>
        </main>

        <footer>
            <!-- Monetization: Support/Freemium -->
            <div class="support-section">
                <p>Enjoying DeepWork?</p>
                <a href="https://buymeacoffee.com/yourusername" class="bmc-btn" target="_blank">
                    ☕ Buy me a coffee
                </a>
            </div>
            <p class="copyright">&copy; 2026 DeepWork App. All rights reserved.</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
